[package]
name = "lvgl"
description = "LVGL 9.2 bindings for Rust (mLupine fork — branch mLupine-lvgl-9). Phase 4 minimum-viable port: display object + image widget + label + screen + snapshot. The legacy 8.x feature surface (lv_drivers backends, embedded_graphics integration, full widget catalog) is gated off."
version = "0.6.2-mLupine-lvgl-9"
authors = [
    "Rafael Caricio <crates.lvgl@caric.io>",
    "Nia Espera <a5b6@riseup.net>",
    "mLupine <maciej@lupin.dev>",
]
edition = "2021"
repository = "https://github.com/mLupine/lv_binding_rust-fork"
license = "MIT"
readme = "../README.md"
categories = ["api-bindings", "embedded", "gui", "no-std"]
keywords = ["littlevgl", "lvgl"]
build = "build.rs"

[dependencies]
lvgl-sys = { version = "0.6.2-mLupine-lvgl-9", path = "../lvgl-sys" }
cty = "0.2.2"

[features]
default = []
# Forward the lvgl-sys vendored-config feature for parity with upstream
# Cargo.toml shape (no behavioural difference -- vendored is the only
# config in this fork).
use-vendored-config = ["lvgl-sys/use-vendored-config"]
# Legacy lvgl-sys flags retained as no-op pass-throughs.
drivers = ["lvgl-sys/drivers"]
rust_timer = ["lvgl-sys/rust_timer"]
custom_timer = ["lvgl-sys/custom_timer"]

[build-dependencies]
# build.rs is a no-op in the LVGL 9 fork; lvgl-codegen is unused.
